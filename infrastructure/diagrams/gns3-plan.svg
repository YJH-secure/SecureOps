<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <title>SecureOps GNS3 망 분리 계획 구성도 (초안, 미구축)</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#2C2C2A">GNS3 계획 구성도 — 초안 · 미구축 (IP 대역은 제안값)</text>

  <ellipse cx="500" cy="78" rx="110" ry="24" fill="#F1EFE8" stroke="#888780"/>
  <text x="500" y="83" font-size="13" fill="#444441" text-anchor="middle">인터넷 (패키지 업데이트용)</text>
  <line x1="500" y1="102" x2="500" y2="150" stroke="#185FA5" stroke-width="1.5"/>
  <text x="510" y="132" font-size="12" fill="#185FA5">WAN · VMware NAT (DHCP)</text>

  <rect x="370" y="150" width="260" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="6 4"/>
  <text x="500" y="174" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">OPNsense 게이트웨이 (신규)</text>
  <text x="500" y="196" font-size="12" fill="#185FA5" text-anchor="middle">구간 방화벽 · Suricata IDS · DHCP</text>
  <text x="500" y="216" font-size="12" fill="#185FA5" text-anchor="middle">2 vCPU · 4GB · 32GB</text>

  <rect x="30" y="140" width="250" height="140" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-dasharray="6 4"/>
  <text x="44" y="162" font-size="13" font-weight="bold" fill="#791F1F">외부 시험망 (격리) · 10.10.0.0/24</text>
  <rect x="60" y="176" width="190" height="64" rx="6" fill="#F1EFE8" stroke="#888780" stroke-dasharray="4 3"/>
  <text x="155" y="198" font-size="13" font-weight="bold" fill="#444441" text-anchor="middle">Kali (신규) · 10.10.0.10</text>
  <text x="155" y="216" font-size="12" fill="#5F5E5A" text-anchor="middle">2 vCPU · 4GB · 40GB</text>
  <text x="155" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">외부 접근 시험 시에만 가동</text>
  <text x="155" y="266" font-size="12" fill="#A32D2D" text-anchor="middle">내부망·관리망 직접 접근 차단</text>
  <line x1="280" y1="192" x2="368" y2="192" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="324" y="184" font-size="12" fill="#A32D2D" text-anchor="middle">OPT3 .1</text>

  <rect x="720" y="140" width="250" height="140" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-dasharray="6 4"/>
  <text x="734" y="162" font-size="13" font-weight="bold" fill="#633806">로그 수집 방향 (초안)</text>
  <text x="734" y="186" font-size="12" fill="#633806">· Suricata 경보·방화벽 로그</text>
  <text x="746" y="203" font-size="12" fill="#633806">→ central-mgmt로 syslog 전송</text>
  <text x="734" y="225" font-size="12" fill="#633806">· ModSecurity 감사 로그</text>
  <text x="746" y="242" font-size="12" fill="#633806">→ ubuntu-a 로컬 보관,</text>
  <text x="746" y="259" font-size="12" fill="#633806">central에서 SSH로 조회</text>
  <line x1="632" y1="192" x2="718" y2="192" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#ar)"/>

  <line x1="500" y1="234" x2="500" y2="290" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="180" y1="290" x2="820" y2="290" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="180" y1="290" x2="180" y2="314" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="500" y1="290" x2="500" y2="314" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="820" y1="290" x2="820" y2="314" stroke="#185FA5" stroke-width="1.5"/>
  <text x="290" y="279" font-size="12" fill="#185FA5">OPT1 · DMZ</text>
  <text x="510" y="279" font-size="12" fill="#185FA5">OPT2 · 내부</text>
  <text x="640" y="279" font-size="12" fill="#185FA5">LAN · 관리</text>

  <rect x="115" y="314" width="130" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="4 3"/>
  <text x="180" y="333" font-size="12" fill="#0C447C" text-anchor="middle">DMZ 스위치 (GNS3)</text>
  <rect x="435" y="314" width="130" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="4 3"/>
  <text x="500" y="333" font-size="12" fill="#0C447C" text-anchor="middle">내부 스위치 (GNS3)</text>
  <rect x="755" y="314" width="130" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="4 3"/>
  <text x="820" y="333" font-size="12" fill="#0C447C" text-anchor="middle">관리 스위치 (GNS3)</text>

  <rect x="30" y="370" width="300" height="250" rx="10" fill="#FDF3EE" stroke="#993C1D" stroke-dasharray="6 4"/>
  <text x="44" y="392" font-size="13" font-weight="bold" fill="#712B13">DMZ · 10.20.0.0/24 · GW .1</text>
  <rect x="350" y="370" width="300" height="250" rx="10" fill="#EEF7F2" stroke="#0F6E56" stroke-dasharray="6 4"/>
  <text x="364" y="392" font-size="13" font-weight="bold" fill="#085041">내부 · 10.30.0.0/24 · GW .1</text>
  <rect x="670" y="370" width="300" height="250" rx="10" fill="#F2F1FC" stroke="#534AB7" stroke-dasharray="6 4"/>
  <text x="684" y="392" font-size="13" font-weight="bold" fill="#3C3489">관리 · 10.40.0.0/24 · GW .1</text>

  <path d="M180 342 V404 M105 404 H255 M105 404 V420 M255 404 V420" fill="none" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="500" y1="342" x2="500" y2="420" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="820" y1="342" x2="820" y2="420" stroke="#185FA5" stroke-width="1.5"/>

  <rect x="40" y="420" width="130" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="105" y="442" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">ubuntu-a (기존)</text>
  <text x="105" y="462" font-size="12" fill="#085041" text-anchor="middle">웹 서버</text>
  <text x="105" y="480" font-size="12" fill="#0F6E56" text-anchor="middle">+ ModSecurity WAF</text>
  <text x="105" y="500" font-size="12" fill="#0F6E56" text-anchor="middle">10.20.0.10</text>
  <text x="105" y="518" font-size="12" fill="#0F6E56" text-anchor="middle">2 vCPU · 4GB</text>
  <text x="105" y="548" font-size="12" fill="#0F6E56" text-anchor="middle">외부 공개: 80/443</text>

  <rect x="190" y="420" width="130" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="255" y="442" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">rocky-b (기존)</text>
  <text x="255" y="462" font-size="12" fill="#085041" text-anchor="middle">DNS 서버</text>
  <text x="255" y="480" font-size="12" fill="#0F6E56" text-anchor="middle">외부: 권한 응답만</text>
  <text x="255" y="500" font-size="12" fill="#0F6E56" text-anchor="middle">10.20.0.20</text>
  <text x="255" y="518" font-size="12" fill="#0F6E56" text-anchor="middle">2 vCPU · 2GB</text>
  <text x="255" y="548" font-size="12" fill="#0F6E56" text-anchor="middle">외부 공개: 53</text>

  <rect x="420" y="420" width="160" height="150" rx="8" fill="#F1EFE8" stroke="#888780" stroke-dasharray="4 3"/>
  <text x="500" y="442" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle">Rocky Server (신규)</text>
  <text x="500" y="462" font-size="12" fill="#444441" text-anchor="middle">내부 서비스</text>
  <text x="500" y="480" font-size="12" fill="#5F5E5A" text-anchor="middle">+ FTP (내부 전용)</text>
  <text x="500" y="500" font-size="12" fill="#5F5E5A" text-anchor="middle">10.30.0.10</text>
  <text x="500" y="518" font-size="12" fill="#5F5E5A" text-anchor="middle">2 vCPU · 2GB · 30GB</text>
  <text x="500" y="548" font-size="12" fill="#5F5E5A" text-anchor="middle">외부 공개: 없음</text>

  <rect x="740" y="420" width="160" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="820" y="442" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">central-mgmt (기존)</text>
  <text x="820" y="462" font-size="12" fill="#085041" text-anchor="middle">중앙 진단·조치</text>
  <text x="820" y="480" font-size="12" fill="#0F6E56" text-anchor="middle">SSH 출발지 고정</text>
  <text x="820" y="500" font-size="12" fill="#0F6E56" text-anchor="middle">10.40.0.10</text>
  <text x="820" y="518" font-size="12" fill="#0F6E56" text-anchor="middle">2 vCPU · 4GB</text>
  <text x="820" y="548" font-size="12" fill="#0F6E56" text-anchor="middle">외부 공개: 없음</text>

  <text x="820" y="600" font-size="12" fill="#3C3489" text-anchor="middle">SSH 22 → DMZ·내부 (관리망에서만)</text>

  <rect x="30" y="644" width="18" height="14" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="56" y="656" font-size="12" fill="#444441">기존 VM 재사용</text>
  <rect x="170" y="644" width="18" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-dasharray="3 2"/>
  <text x="196" y="656" font-size="12" fill="#444441">신규 VM (미구축)</text>
  <rect x="320" y="644" width="18" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-dasharray="3 2"/>
  <text x="346" y="656" font-size="12" fill="#444441">네트워크 장비 (미구축)</text>
  <line x1="490" y1="651" x2="520" y2="651" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="528" y="656" font-size="12" fill="#444441">외부 시험 트래픽</text>
  <line x1="650" y1="651" x2="680" y2="651" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="688" y="656" font-size="12" fill="#444441">로그 전송</text>
  <text x="30" y="690" font-size="12" fill="#5F5E5A">IP 대역·인터페이스 이름은 계획 초안이며, 실제 OPNsense 인터페이스명(vmx0 등)은 설치 후 확정한다. 실제 VM·네트워크 변경은 별도 승인 후 진행.</text>
</svg>
