<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <title>SecureOps 현재 구성 (VMware Workstation, 구축 완료, 2026-11-16 기준)</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#2C2C2A">현재 구성 — VMware Workstation · 구축 완료 (2026-11-16 기준, 실측)</text>

  <rect x="20" y="50" width="860" height="370" rx="10" fill="#F7F8FA" stroke="#9AA3AD" stroke-dasharray="6 4"/>
  <text x="36" y="76" font-size="13" fill="#5F5E5A">호스트 PC · Windows 11 · VMware Workstation</text>

  <rect x="360" y="92" width="180" height="54" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="450" y="114" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">VMnet8 (NAT)</text>
  <text x="450" y="134" font-size="12" fill="#185FA5" text-anchor="middle">192.168.10.0/24 · GW/DNS .2</text>
  <text x="556" y="116" font-size="12" fill="#5F5E5A">인터넷 방향 NAT만 제공</text>
  <text x="556" y="133" font-size="12" fill="#5F5E5A">외부 → VM 직접 유입 없음</text>

  <line x1="450" y1="146" x2="450" y2="190" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="190" y1="190" x2="710" y2="190" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="190" y1="190" x2="190" y2="226" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="450" y1="190" x2="450" y2="226" stroke="#185FA5" stroke-width="1.5"/>
  <line x1="710" y1="190" x2="710" y2="226" stroke="#185FA5" stroke-width="1.5"/>

  <g>
    <rect x="80" y="226" width="220" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="190" y="250" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">central-mgmt</text>
    <text x="190" y="270" font-size="12" fill="#0F6E56" text-anchor="middle">Ubuntu 24.04.5 Server</text>
    <text x="190" y="288" font-size="12" fill="#0F6E56" text-anchor="middle">192.168.10.10 · ens33</text>
    <text x="190" y="306" font-size="12" fill="#0F6E56" text-anchor="middle">2 vCPU · 4GB · 40GB</text>
    <text x="190" y="326" font-size="12" fill="#085041" text-anchor="middle">중앙 진단 · 진단 SSH 출발지</text>
  </g>
  <g>
    <rect x="340" y="226" width="220" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="450" y="250" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">ubuntu-a</text>
    <text x="450" y="270" font-size="12" fill="#0F6E56" text-anchor="middle">Ubuntu 24.04.5 Desktop</text>
    <text x="450" y="288" font-size="12" fill="#0F6E56" text-anchor="middle">192.168.10.20 · ens33</text>
    <text x="450" y="306" font-size="12" fill="#0F6E56" text-anchor="middle">2 vCPU · 4GB · 30GB</text>
    <text x="450" y="326" font-size="12" fill="#085041" text-anchor="middle">진단 대상 A</text>
  </g>
  <g>
    <rect x="600" y="226" width="220" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="710" y="250" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle">rocky-b</text>
    <text x="710" y="270" font-size="12" fill="#0F6E56" text-anchor="middle">Rocky Linux 9.8 Desktop</text>
    <text x="710" y="288" font-size="12" fill="#0F6E56" text-anchor="middle">192.168.10.30 · ens160</text>
    <text x="710" y="306" font-size="12" fill="#0F6E56" text-anchor="middle">2 vCPU · 2GB · 30GB</text>
    <text x="710" y="326" font-size="12" fill="#085041" text-anchor="middle">진단 대상 B</text>
  </g>

  <path d="M190 346 V370 H450 V350" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M450 370 H710 V350" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="450" y="396" font-size="12" fill="#3C3489" text-anchor="middle">SSH 22 · 진단 출발지 192.168.10.10 (scan·fix 키는 중앙에만) · secureops-scan(진단·읽기) / secureops-fix(승인 후에만)</text>

  <rect x="20" y="430" width="425" height="138" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="36" y="454" font-size="13" font-weight="bold" fill="#085041">구축 완료 (실측)</text>
  <text x="36" y="476" font-size="12" fill="#085041">· VM 3대 · 고정 IP · VMnet8 NAT 단일망</text>
  <text x="36" y="494" font-size="12" fill="#085041">· 전용 계정 scan/fix · Ed25519 키 인증 · sudoers v0</text>
  <text x="36" y="512" font-size="12" fill="#085041">· 스냅샷 · 백업 SHA-256 · 복원 시험</text>
  <text x="36" y="530" font-size="12" fill="#085041">· C 모듈 4종 대상 2대 실행 (일반 권한)</text>
  <text x="36" y="548" font-size="12" font-weight="bold" fill="#085041">· SSH-01 실환경 E2E 2대 (11/16): 수집 → B 판정 → D 저장</text>

  <rect x="455" y="430" width="425" height="138" rx="8" fill="#F1EFE8" stroke="#888780" stroke-dasharray="5 3"/>
  <text x="471" y="454" font-size="13" font-weight="bold" fill="#444441">예정 · 미구축</text>
  <text x="471" y="476" font-size="12" fill="#5F5E5A">· VMware ↔ GNS3 최소 연결 검증 (기본 단계)</text>
  <text x="471" y="494" font-size="12" fill="#5F5E5A">· GNS3 · OPNsense 망 분리 (별도 계획도)</text>
  <text x="471" y="512" font-size="12" fill="#5F5E5A">· 방화벽 SSH 출발지 제한 (GNS3 단계에서 적용)</text>
</svg>
